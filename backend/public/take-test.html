<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Прохождение теста | ZEDLY</title>
    <meta name="description" content="🧠 Интерактивное прохождение теста с таймером и надежной отправкой результатов.">
    <meta name="keywords" content="прохождение теста, онлайн тест, экзамен, ZEDLY">
    <link rel="canonical" href="https://zedly.uz/take-test.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="✅ Прохождение теста | ZEDLY">
    <meta property="og:description"
        content="🧠 Интерактивное прохождение теста с таймером и надежной отправкой результатов.">
    <meta property="og:url" content="https://zedly.uz/take-test.html">
    <meta property="og:image" content="https://zedly.uz/images/zedly_logo_bg.png">
    <meta property="og:site_name" content="ZEDLY">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="✅ Прохождение теста | ZEDLY">
    <meta name="twitter:description"
        content="🧠 Интерактивное прохождение теста с таймером и надежной отправкой результатов.">
    <meta name="twitter:image" content="https://zedly.uz/images/zedly_logo_bg.png">
    <link rel="icon" type="image/png" href="/images/zedly_logo_bg.png">
    <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/take-test.css">
    <script src="/runtime-config.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/console-silence.js"></script>
</head>

<body class="take-test-page">
    <!-- Test Header -->
    <div class="test-header">
        <div class="test-header-content">
            <div class="test-info">
                <h1 class="test-title" id="testTitle">Loading test...</h1>
                <div class="test-meta" id="testMeta"></div>
            </div>
            <div class="test-header-right">
                <div class="test-timer" id="testTimer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span id="timerDisplay">--:--</span>
                </div>
                <div class="test-header-controls">
                    <div class="lang-switch">
                        <button class="lang-btn active" data-lang="ru">RU</button>
                        <button class="lang-btn" data-lang="uz">UZ</button>
                    </div>
                    <button class="theme-toggle icon-btn" id="themeToggle" data-i18n-title="theme.toggle" title="Тема"
                        aria-label="Toggle theme">
                        <svg class="theme-icon" width="20" height="20" viewBox="0 0 20 20">
                            <path class="sun"
                                d="M10 2v2m0 12v2M4.22 4.22l1.42 1.42m8.72 8.72l1.42 1.42M2 10h2m12 0h2M4.22 15.78l1.42-1.42m8.72-8.72l1.42-1.42M10 5.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z" />
                            <path class="moon"
                                d="M10 2c1.34 0 2.62.26 3.77.74A6 6 0 017.5 14a6 6 0 01-5.26-6.49A8 8 0 0010 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Test Container -->
    <div class="test-container">
        <!-- Question Display Area -->
        <div class="question-area">
            <div id="questionContainer" data-no-fallback-i18n>
                <!-- Questions will be rendered here -->
            </div>

            <!-- Navigation Buttons -->
            <div class="question-controls">
                <button class="btn btn-outline" id="prevBtn" style="visibility: hidden;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Назад
                </button>
                <button class="btn btn-primary" id="nextBtn">
                    Вперед
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <div class="question-nav">
                <div class="nav-header">
                    <h3>Вопросы</h3>
                    <div class="nav-legend">
                        <div class="legend-item">
                            <span class="legend-dot answered"></span>
                            <span>Отвечен</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot unanswered"></span>
                            <span>Без ответа</span>
                        </div>
                    </div>
                </div>
                <div class="nav-grid" id="questionNav"></div>
            </div>
        </div>
    </div>

    <!-- Auto-save Indicator -->
    <div class="auto-save-indicator" id="autoSaveIndicator">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Changes saved</span>
    </div>

    <script src="/js/auth-interceptor.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/take-test.js"></script>
    <script src="/js/alert-modal.js"></script>
</body>

</html>
