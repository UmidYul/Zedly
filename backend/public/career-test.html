<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профориентационный тест | ZEDLY</title>
    <meta name="description" content="🎯 Профориентационный тест с персональными рекомендациями по предметам и направлениям обучения.">
    <meta name="keywords" content="профориентационный тест, выбор профессии, школьники Узбекистана, ZEDLY">
    <link rel="canonical" href="https://zedly.uz/career-test.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="🧭 Профориентационный тест | ZEDLY">
    <meta property="og:description" content="🎯 Профориентационный тест с персональными рекомендациями по предметам и направлениям обучения.">
    <meta property="og:url" content="https://zedly.uz/career-test.html">
    <meta property="og:image" content="https://zedly.uz/images/zedly_logo_bg.png">
    <meta property="og:site_name" content="ZEDLY">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🧭 Профориентационный тест | ZEDLY">
    <meta name="twitter:description" content="🎯 Профориентационный тест с персональными рекомендациями по предметам и направлениям обучения.">
    <meta name="twitter:image" content="https://zedly.uz/images/zedly_logo_bg.png">
    <link rel="icon" type="image/png" href="/images/zedly_logo_bg.png">
    <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/career.css">
    <script src="/runtime-config.js"></script>
<script src="/js/api-client.js"></script>
<script src="/js/console-silence.js"></script>
</head>
<body>
    <main class="career-test-layout" id="careerStandaloneRoot">
        <section class="career-test-shell">
            <div class="career-test-topbar">
                <button class="btn btn-outline" id="careerBackBtn" type="button" data-i18n="careerTest.back">Вернуться к профориентации</button>
                <div class="career-test-topbar-actions">
                    <span id="careerFormStatus" class="career-status"></span>
                    <button class="theme-toggle icon-btn" id="themeToggle" title="Тема" data-i18n-title="theme.toggle" aria-label="Переключить тему" type="button">
                        <svg class="theme-icon" width="20" height="20" viewBox="0 0 20 20">
                            <path class="sun" d="M10 2v2m0 12v2M4.22 4.22l1.42 1.42m8.72 8.72l1.42 1.42M2 10h2m12 0h2M4.22 15.78l1.42-1.42m8.72-8.72l1.42-1.42M10 5.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z" />
                            <path class="moon" d="M10 2c1.34 0 2.62.26 3.77.74A6 6 0 017.5 14a6 6 0 01-5.26-6.49A8 8 0 0010 2z" />
                        </svg>
                    </button>
                </div>
            </div>

            <header class="career-test-header">
                <h1 data-i18n="careerTest.title">Профориентационный тест</h1>
                <p data-i18n="careerTest.subtitle">Отвечайте честно: так рекомендации по предметам и направлениям будут точнее.</p>
            </header>

            <div class="career-test-progress">
                <div class="career-test-progress-label">
                    <span id="careerProgressLabel" data-i18n="careerTest.progressFallback">Вопрос 0 из 0</span>
                    <span id="careerProgressPercent">0%</span>
                </div>
                <div class="career-test-progress-track">
                    <div class="career-test-progress-bar" id="careerProgressBar"></div>
                </div>
            </div>

            <form id="careerTestForm">
                <div class="career-step-card">
                    <div class="career-step-index" id="careerQuestionIndex">1</div>
                    <h2 class="career-step-title" id="careerQuestionTitle" data-i18n="careerTest.loading">Загружаем вопросы...</h2>
                    <div class="career-step-options" id="careerQuestionOptions"></div>
                </div>

                <div class="career-step-actions">
                    <button class="btn btn-outline" type="button" id="careerPrevBtn" data-i18n="careerTest.prev">Назад</button>
                    <button class="btn btn-primary" type="button" id="careerNextBtn" data-i18n="careerTest.next">Далее</button>
                    <button class="btn btn-primary" type="submit" id="careerSubmitBtn" style="display:none;" data-i18n="careerTest.finish">Завершить тест</button>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/auth-interceptor.js"></script>
    <script src="/js/alert-modal.js"></script>
    <script src="/js/career.js"></script>
    <script>
        window.CareerManager && window.CareerManager.init && window.CareerManager.init();
    </script>
</body>
</html>
