<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/zedly_logo_bg.png">
    <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Auth Debug - ZEDLY</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1729;
            color: #e2e8f0;
            padding: 24px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1a2332;
            border-radius: 12px;
            padding: 24px;
        }
        h1 { margin-top: 0; color: #4a90e2; }
        h2 { color: #50e3c2; margin-top: 24px; }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .ok { background: rgba(76, 175, 80, 0.18); border: 1px solid #4caf50; }
        .warn { background: rgba(255, 152, 0, 0.18); border: 1px solid #ff9800; }
        .err { background: rgba(244, 67, 54, 0.18); border: 1px solid #f44336; }
        pre {
            background: #0f1729;
            border-radius: 8px;
            padding: 12px;
            overflow: auto;
        }
        .actions { margin-top: 24px; }
        button {
            background: #4a90e2;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }
    </style>
    <script src="js/auth-interceptor.js"></script>
    <script src="/runtime-config.js"></script>
<script src="/js/api-client.js"></script>
<script src="/js/console-silence.js"></script>
</head>
<body>
<div class="container">
    <h1>Auth Debug</h1>
    <p>Проверка cookie-based авторизации (без чтения access token из localStorage).</p>

    <h2>Статус</h2>
    <div id="status"></div>

    <h2>Пользователь</h2>
    <div id="user"></div>

    <h2>API тесты</h2>
    <div id="api"></div>

    <div class="actions">
        <button onclick="testAuthMe()">Проверить /api/auth/me</button>
        <button onclick="testRefresh()">Проверить /api/auth/refresh</button>
        <button onclick="clearLocalCache()">Очистить localStorage кеш</button>
        <button onclick="location.reload()">Обновить</button>
    </div>
</div>

<script>
    function hasCookie(name) {
        const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp('(?:^|; )' + escaped + '=').test(document.cookie || '');
    }

    function renderStatus() {
        const root = document.getElementById('status');
        const rows = [
            { ok: hasCookie('zedly_access_token'), okText: 'Access cookie найден', errText: 'Access cookie не найден' },
            { ok: hasCookie('zedly_refresh_token'), okText: 'Refresh cookie найден', errText: 'Refresh cookie не найден' },
            { ok: hasCookie('zedly_csrf_token'), okText: 'CSRF cookie найден', errText: 'CSRF cookie не найден' }
        ];

        root.innerHTML = rows.map((row) => (
            '<div class="status ' + (row.ok ? 'ok' : 'warn') + '">' + (row.ok ? row.okText : row.errText) + '</div>'
        )).join('');
    }

    function renderUserCache() {
        const root = document.getElementById('user');
        const raw = localStorage.getItem('user');
        if (!raw) {
            root.innerHTML = '<div class="status warn">localStorage.user не найден</div>';
            return;
        }
        try {
            root.innerHTML = '<pre>' + JSON.stringify(JSON.parse(raw), null, 2) + '</pre>';
        } catch (e) {
            root.innerHTML = '<div class="status err">Невалидный JSON в localStorage.user</div>';
        }
    }

    async function testAuthMe() {
        const root = document.getElementById('api');
        root.innerHTML = '<div class="status warn">Запрос /api/auth/me...</div>';
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            const body = await res.json().catch(() => ({}));
            root.innerHTML = '<div class="status ' + (res.ok ? 'ok' : 'err') + '">/api/auth/me: ' + res.status + '</div><pre>' + JSON.stringify(body, null, 2) + '</pre>';
        } catch (e) {
            root.innerHTML = '<div class="status err">Ошибка: ' + e.message + '</div>';
        }
    }

    async function testRefresh() {
        const root = document.getElementById('api');
        root.innerHTML = '<div class="status warn">Запрос /api/auth/refresh...</div>';
        try {
            const res = await fetch('/api/auth/refresh', { method: 'POST', credentials: 'include' });
            const body = await res.json().catch(() => ({}));
            root.innerHTML = '<div class="status ' + (res.ok ? 'ok' : 'err') + '">/api/auth/refresh: ' + res.status + '</div><pre>' + JSON.stringify(body, null, 2) + '</pre>';
        } catch (e) {
            root.innerHTML = '<div class="status err">Ошибка: ' + e.message + '</div>';
        }
    }

    function clearLocalCache() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        localStorage.removeItem('user');
        renderStatus();
        renderUserCache();
        alert('Локальный кеш очищен');
    }

    renderStatus();
    renderUserCache();
</script>
<script src="/js/alert-modal.js"></script>
</body>
</html>
