name: ${COMPOSE_PROJECT_NAME:-zedly_prod}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - zedly_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "start:api"]
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-240}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_URL: ${APP_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-None}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SERVE_FRONTEND: "false"
      SERVE_API: "true"
    volumes:
      - zedly_prod_uploads:/app/uploads
      - zedly_prod_backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start:web"]
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${WEB_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      SERVE_COMPILED_FRONTEND: ${SERVE_COMPILED_FRONTEND:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ENABLE_DEADLINE_REMINDER_JOB: ${ENABLE_DEADLINE_REMINDER_JOB:-true}
      ENABLE_NOTIFICATION_DIGEST_JOB: ${ENABLE_NOTIFICATION_DIGEST_JOB:-true}
    volumes:
      - zedly_prod_uploads:/app/uploads
      - zedly_prod_backups:/app/backups

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/zedly.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  zedly_prod_postgres_data:
  zedly_prod_uploads:
  zedly_prod_backups:
