name: ${COMPOSE_PROJECT_NAME:-zedly_local}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZEDLY_DB_NAME:-zedly_local}
      POSTGRES_USER: ${ZEDLY_DB_USER:-zedly_local_user}
      POSTGRES_PASSWORD: ${ZEDLY_DB_PASSWORD:-zedly_local_password}
      DUMP_OWNER_ROLE: ${ZEDLY_DUMP_OWNER_ROLE:-zedlyuz}
    ports:
      - "${ZEDLY_DB_PORT:-5433}:5432"
    volumes:
      - zedly_local_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-seed:ro
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZEDLY_DB_USER:-zedly_local_user} -d ${ZEDLY_DB_NAME:-zedly_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ZEDLY_APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${ZEDLY_DB_NAME:-zedly_local}
      DB_USER: ${ZEDLY_DB_USER:-zedly_local_user}
      DB_PASSWORD: ${ZEDLY_DB_PASSWORD:-zedly_local_password}
      JWT_SECRET: ${JWT_SECRET:-docker_local_jwt_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-docker_local_refresh_secret_change_me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      API_URL: ${ZEDLY_API_URL:-http://localhost:5000}
      FRONTEND_URL: ${ZEDLY_FRONTEND_URL:-http://localhost:5000}
      APP_URL: ${ZEDLY_APP_URL:-http://localhost:5000}
      WEB_BASE_URL: ${ZEDLY_WEB_BASE_URL:-http://localhost:5000}
      API_BASE_URL: ${ZEDLY_API_BASE_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${ZEDLY_CORS_ALLOWED_ORIGINS:-http://localhost:5000}
      COOKIE_SECURE: "false"
      SERVE_API: "true"
      SERVE_FRONTEND: "true"
    volumes:
      - zedly_local_uploads:/app/uploads
      - zedly_local_backups:/app/backups
      - ./backend/.env:/app/.env:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  zedly_local_postgres_data:
  zedly_local_uploads:
  zedly_local_backups:
